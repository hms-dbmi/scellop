# One-shot publish of 0.0.0 placeholders for package names that do not exist on
# npm yet.
#
# npm only accepts a trusted-publisher configuration for a package that already
# exists, so a brand-new name cannot come from release.yml. This claims the two
# scoped names with a throwaway 0.0.0 using a short-lived granular token. Once
# the trusted publishers are configured, revoke the token and delete this file;
# release.yml then publishes every real version tokenlessly via OIDC.
#
# `scellop` is deliberately absent: it already exists on npm and needs no
# bootstrap.
name: Bootstrap publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "publish" to confirm. This cannot be undone.
        required: true
        type: string

jobs:
  bootstrap:
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    # Gates the token behind an environment so it is readable only here, and
    # only after any configured approval.
    environment: npm-bootstrap
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Set both versions before publishing either: pnpm rewrites the
      # `workspace:*` dependency to the exact version it publishes, so
      # hubmap-data-loading@0.0.0 must point at data-loading@0.0.0.
      - name: Stamp placeholder versions
        run: |
          npm pkg set version=0.0.0 --prefix packages/data-loading
          npm pkg set version=0.0.0 --prefix packages/hubmap-data-loading

      - run: pnpm build

      - name: Publish placeholders
        run: |
          pnpm --filter @scellop/data-loading publish --no-git-checks
          pnpm --filter @scellop/hubmap-data-loading publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
